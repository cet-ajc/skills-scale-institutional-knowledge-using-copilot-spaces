services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=CleanArchitectureDb;User Id=sa;******;TrustServerCertificate=True;
      - JwtSettings__SecretKey=${JWT_SECRET_KEY:-CHANGE_THIS_TO_A_STRONG_SECRET_KEY_IN_PRODUCTION_ENV}
      - JwtSettings__Issuer=CleanArchitectureAPI
      - JwtSettings__Audience=CleanArchitectureAPI
      - JwtSettings__ExpiryMinutes=60
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "${SA_PASSWORD:-YourStrong@Passw0rd}"
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${SA_PASSWORD:-YourStrong@Passw0rd}' -Q 'SELECT 1' -C || exit 1"]
      interval: 10s
      retries: 10
      start_period: 30s
      timeout: 5s
    restart: unless-stopped

volumes:
  sqlserver_data:
